# One your-mail-mcp instance for an account that only accepts XOAUTH2. The
# image is this fork's build, which carries the Cyrus SASL XOAUTH2 plugin and
# python3 for the token helper. See README.md here.
services:
  your-mail-mcp:
    image: ghcr.io/samuelwehrli/your-mail-mcp:latest
    command: serve
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    volumes:
      - ./accounts.json:/config/accounts.json:ro
      # Bind mounts rather than named volumes so the mirror and index sit in
      # this directory and are covered by whatever backs it up.
      - ./mail:/mail
      - ./index:/index
      # Writable: the token helper rewrites token.txt on every refresh.
      - ./oauth:/oauth
